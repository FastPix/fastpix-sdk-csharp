trigger:
- feature/*

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self
  fetchDepth: 0

# Prepare SonarCloud Analysis
# NOSONAR - Azure DevOps task references support only the major version (@3);
# a full semver (@3.x.y) is not valid syntax, so the version is left as-is.
- task: SonarCloudPrepare@3 # NOSONAR
  inputs:
    SonarCloud: 'sdk_sonar'
    organization: 'fastpix'
    scannerMode: 'dotnet'
    projectKey: 'FastPix_csharp-language-sdk-server-side'
    projectName: 'csharp-language-sdk-server-side'

# Build required for .NET analysis
- script: |
    dotnet restore
    dotnet build --configuration Release
  displayName: 'Build Project'

# Run Analysis
- task: SonarCloudAnalyze@3 # NOSONAR

# Publish Quality Gate
- task: SonarCloudPublish@3 # NOSONAR
  inputs:
    pollingTimeoutSec: '300'