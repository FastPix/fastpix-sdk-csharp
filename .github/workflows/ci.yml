name: CI

# Validation gate: builds the SDK and runs the offline unit-test suite on every
# push and pull request. Complements fastpix-csharp.yml, which only publishes on tags.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore src/Fastpix/Fastpix.csproj

      - name: Build validation harness
        run: dotnet build --configuration Release tests/Fastpix.Tests.csproj

      - name: Unit tests
        run: dotnet test tests-unit/Fastpix.UnitTests.csproj --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unit-tests.trx'
          if-no-files-found: ignore
